spring.application.name=coldchain-web
server.port=8080
# Tables live in their own schema (coldchain_web) so existing tables in coldchain_db are never touched.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/coldchain_db?currentSchema=coldchain_web}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.thymeleaf.cache=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Demonstration MFA only (not email/SMS)
coldchain.mfa.code=${MFA_CODE:123456}
coldchain.mfa.expiry-seconds=300
coldchain.mfa.max-attempts=5
coldchain.simulation.enabled=true
coldchain.simulation.interval-ms=10000
coldchain.demo-password=${DEMO_PASSWORD:Admin@123}
coldchain.simulation.stale-seconds=60
